name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No secrets are used.
permissions:
  contents: read

# The verify job needs a real Postgres because two vitest suites hit the DB:
#   - src/modules/immigration/task-generator.race.test.ts (concurrent race regression)
#   - src/modules/interviews/conflict.test.ts (time-conflict guard)
# Running them against a placeholder URL would silently skip real coverage.
env:
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-placeholder-secret-must-be-at-least-32-chars-long
  AUTH_URL: http://localhost:3000
  AWS_REGION: eu-west-1
  S3_BUCKET_DOCUMENTS: ci-placeholder-bucket
  LOG_LEVEL: warn
  NODE_ENV: test

# A newer push to the same PR supersedes the older run. Runs on main are
# never cancelled: every main commit keeps its own complete Verify + E2E
# result, which Vercel Deployment Checks read before promoting it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Health check so tests only run once Postgres is accepting connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # pnpm/action-setup reads the version from `packageManager` in package.json.
      # Do NOT set `with: version:` here — it errors when packageManager is also declared.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Approve required build scripts
        # argon2 needs a native compile; approve non-interactively.
        run: pnpm rebuild argon2

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply migrations to CI Postgres
        # The two DB-dependent vitest suites need the schema in place. This
        # doubles as a "migrations are internally consistent" check.
        run: pnpm db:migrate

      - name: Generate test-only credentials
        # Fresh random passwords for the e2e accounts on every run — never
        # committed to source, masked in logs, gone when the job ends.
        run: |
          for name in E2E_ADMIN_PASSWORD E2E_STAFF_PASSWORD; do
            value="Ci-$(openssl rand -hex 16)-Aa1!"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Seed E2E admin user
        # Non-interactive, idempotent. task-generator.race.test.ts and
        # interviews/conflict.test.ts read this row.
        run: pnpm db:seed:e2e-admin

      - name: Seed baseline services + docs + currencies
        # Some vitest/integration tests reference specific service
        # catalog items (Work Permit, Immigration Services). Match the
        # real onboarding order: currencies → doc types → services.
        run: |
          pnpm db:seed:currencies
          pnpm db:seed:document-types
          pnpm db:seed:services

      - name: Seed accounting (chart of accounts + divisions + rules)
        # The accounting-walk e2e tests expect a populated chart. The
        # script is idempotent so re-running it in a cached CI DB is
        # safe.
        run: pnpm db:seed:accounting

      - name: Seed skills catalog
        # The CV-parser catalog-hit path needs a populated skills table
        # to find skills embedded in CV text. Idempotent via UNIQUE(name).
        run: pnpm db:seed:skills

      - name: Seed E2E minimal fixtures
        run: pnpm db:seed:e2e-minimal

      - name: Test
        run: pnpm test

      - name: Build (production)
        # `next build` sets NODE_ENV=production, so env.ts's fail-closed prod
        # validation fires. Provide the two required prod-only secrets that
        # aren't in the top-level env: block.
        env:
          CRON_SECRET: ci-placeholder-cron-secret
          EMAIL_CRED_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: pnpm build

      - name: Verify all migrations are committed
        # Regenerate — if diff appears, schema drifted from migrations. Fail the build.
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain src/lib/db/migrations)" ]; then
            echo "::error::Uncommitted migration files — run 'pnpm db:generate' and commit the SQL."
            git status --porcelain src/lib/db/migrations
            exit 1
          fi

  # End-to-end tests, split across parallel shards.
  #
  # Isolation: every shard is its own job with its OWN Postgres service
  # container, migrated and seeded from scratch, so shards never share
  # database rows. Inside a shard the suite still runs one test at a time
  # (playwright.config: workers 1, fullyParallel false), exactly as before.
  # Playwright's --shard splits the 592 tests by file; every test runs in
  # exactly one shard.
  #
  # Server: each shard runs `next dev` exactly as before, so the tests run
  # unchanged. (Running E2E against a production build is a measured
  # follow-up: it needs ~6 tests' dev-mode timing assumptions fixed first.)
  #
  # The upload flow is exercised locally against docker-compose MinIO; in CI
  # it's skipped via E2E_SKIP_UPLOAD because both quay.io and Docker Hub have
  # started refusing anonymous pulls for the MinIO image.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every shard finish so one failure doesn't hide others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # No S3_ENDPOINT — S3Client falls back to real AWS SDK defaults, and
      # because E2E_SKIP_UPLOAD=1 gates every presign, nothing hits the
      # network. Keeping the client constructable at boot is all we need.
      # Playwright needs the app URL exposed to the browser context.
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      CRON_SECRET: ci-placeholder-cron-secret
      EMAIL_CRED_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      E2E_SKIP_UPLOAD: '1'
      # qa-supplement.spec.ts hr test resets state via Clock out →
      # Clock in. Disables the once-per-day guard in modules/hr/service
      # (the rule itself is covered by src/modules/hr/daily-limit.test.ts).
      E2E_SKIP_HR_DAILY_LIMIT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Approve required build scripts
        run: pnpm rebuild argon2

      - name: Install Playwright browsers (chromium only)
        # `--with-deps` pulls the shared libs Chromium needs on ubuntu runners.
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations to CI Postgres
        run: pnpm db:migrate

      - name: Generate test-only credentials
        # Fresh random passwords for the e2e accounts on every run — never
        # committed to source, masked in logs, gone when the job ends.
        run: |
          for name in E2E_ADMIN_PASSWORD E2E_STAFF_PASSWORD; do
            value="Ci-$(openssl rand -hex 16)-Aa1!"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Seed E2E admin user
        run: pnpm db:seed:e2e-admin

      - name: Seed baseline services + docs + currencies
        # qa-billing-e2e picks a service by name from the CatalogAutosuggest;
        # needs the "Work Permit" catalog item to exist.
        run: |
          pnpm db:seed:currencies
          pnpm db:seed:document-types
          pnpm db:seed:services

      - name: Seed accounting (chart of accounts + divisions + rules)
        # Needed by the accounting-walk e2e tests (chart of accounts,
        # VAT return, year-end close) which assert the layout against
        # real seed data.
        run: pnpm db:seed:accounting

      - name: Seed E2E minimal fixtures (1 employer, 1 requisition, 2 candidates, 1 lead)
        # Gives the Playwright suite something to click on. Tests like
        # catalog-inline-create, qa-supplement, and the per-page detail-
        # navigation checks fail on a bare DB because the page has zero
        # rows to interact with.
        run: pnpm db:seed:e2e-minimal

      - name: Run Playwright (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The single required check. Vercel Deployment Checks (and any GitHub
  # ruleset) require the exact name "E2E". It passes ONLY when every shard
  # succeeded: a failed, cancelled, timed-out or skipped shard fails it.
  # `if: always()` makes it run (and fail) instead of being skipped when a
  # shard fails — a skipped required check could otherwise count as passing.
  e2e:
    name: E2E
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every E2E shard to pass
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "E2E shards result: $SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::One or more E2E shards did not succeed ($SHARDS_RESULT)."
            exit 1
          fi
