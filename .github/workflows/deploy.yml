name: Deploy

# Deploy pipeline for main. Gated so nothing ships until the whole
# verification suite (typecheck, lint, unit tests, integration tests,
# e2e tests) has already passed on the same SHA via ci.yml.
#
# Flow:
#   1. `wait-for-ci`  — hard block until ci.yml (both verify + e2e jobs)
#                       completes successfully for this commit. If CI is
#                       still running we wait; if it failed we abort.
#   2. `db-push`      — apply schema changes to the production database.
#                       Uses `drizzle-kit push` for a state-based apply
#                       rather than the migration file replay CI uses.
#                       DATABASE_URL comes from secrets, never from env.
#   3. `deploy`       — placeholder for the platform-specific push
#                       (Vercel / Fly / Docker / etc.). Wire this up
#                       once the deploy target is chosen — the guard
#                       and db-push steps above are the immovable ones.
#
# Branch protection on main should require BOTH `CI / verify` and
# `CI / e2e` as required status checks so a merge can't happen without
# a green CI run. This workflow doubles that guarantee for direct
# pushes (which shouldn't happen under branch protection, but belt &
# braces).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only one deploy at a time on main — cancel any in-flight run when a
  # newer commit lands.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI/Verify to succeed
        # `lewagon/wait-on-check-action` polls the checks API for the
        # given commit SHA. If the check fails or is cancelled, this
        # step fails and the rest of the pipeline is skipped.
        # The check names are the job names from ci.yml ("Verify" +
        # "E2E") — GitHub does NOT prefix them with the workflow name
        # in the checks API, only in the PR summary UI.
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: Verify
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      - name: Wait for CI/E2E to succeed
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: E2E
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  db-push:
    name: Apply DB schema (drizzle push)
    needs: wait-for-ci
    runs-on: ubuntu-latest
    env:
      # Production DATABASE_URL comes from a repository secret. Never
      # commit a real URL. The drizzle-kit push command reads it via
      # drizzle.config.ts, which itself reads env.DATABASE_URL.
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # Drizzle push requires the same env shape as runtime, but for
      # this step none of the app runtime services (S3, cron, email
      # crypto) are exercised — placeholders keep env.ts's zod schema
      # happy without exposing real secrets.
      AUTH_SECRET: ${{ secrets.PROD_AUTH_SECRET }}
      AUTH_URL: ${{ secrets.PROD_AUTH_URL }}
      AWS_REGION: eu-west-1
      S3_BUCKET_DOCUMENTS: placeholder
      LOG_LEVEL: warn
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Approve required build scripts
        run: pnpm rebuild argon2

      - name: Push schema to production
        # State-based push. CI already ran the migration replay against
        # a scratch DB, so any drift here would be a bug in the migration
        # generator, not a schema mismatch.
        run: pnpm exec drizzle-kit push

  # Deploy is handled by Vercel's native GitHub integration — every push
  # to main triggers a build+deploy on Vercel's side, using the env vars
  # configured in the Vercel dashboard. That flow was set up when the
  # project was first linked via `vercel link`.
  #
  # This workflow owns the two things Vercel's integration doesn't:
  #   1. wait-for-ci — deploy only proceeds if CI has passed for the SHA
  #   2. db-push — drizzle-kit push against the prod DB before the app
  #      picks up the new schema
  #
  # If you ever want CI-driven deploys (e.g. more control over the
  # promote step, or to run more pre-deploy scripts), disable the
  # Vercel-side integration in Project Settings → Git and re-add the
  # `deploy: needs: db-push` job here that runs `vercel deploy --prod`.
  post-deploy-check:
    name: Confirm Vercel deploy is live
    needs: db-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel's own deploy to reach READY
        # Poll Vercel's API for the latest production deployment on this
        # SHA. Exit successfully once readyState=READY or fail if it
        # reaches ERROR/CANCELED. 5-minute total budget.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Watching Vercel for prod deploy of $SHA…"
          for i in $(seq 1 30); do
            resp=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=5")
            # jq extracts readyState of the first deployment whose meta
            # commit SHA matches ours. Empty string when no match yet.
            match=$(echo "$resp" | jq -r --arg sha "$SHA" 'first(.deployments[]? | select(.meta.githubCommitSha == $sha) | .readyState) // ""')
            case "$match" in
              READY)     echo "✓ Vercel deploy READY"; exit 0;;
              ERROR)     echo "✗ Vercel deploy ERROR";  exit 1;;
              CANCELED)  echo "✗ Vercel deploy CANCELED"; exit 1;;
              "")        echo "  [$i/30] no matching deployment yet for $SHA";;
              *)         echo "  [$i/30] state=$match";;
            esac
            sleep 10
          done
          echo "✗ Timed out waiting for Vercel deploy"
          exit 1
