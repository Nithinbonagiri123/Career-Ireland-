name: Deploy

# Deploy pipeline for main. Gated so nothing ships until the whole
# verification suite (typecheck, lint, unit tests, integration tests,
# e2e tests) has already passed on the same SHA via ci.yml.
#
# Flow:
#   1. `wait-for-ci`  — hard block until ci.yml (both verify + e2e jobs)
#                       completes successfully for this commit. If CI is
#                       still running we wait; if it failed we abort.
#   2. `db-push`      — apply schema changes to the production database.
#                       Uses `drizzle-kit push` for a state-based apply
#                       rather than the migration file replay CI uses.
#                       DATABASE_URL comes from secrets, never from env.
#   3. `deploy`       — placeholder for the platform-specific push
#                       (Vercel / Fly / Docker / etc.). Wire this up
#                       once the deploy target is chosen — the guard
#                       and db-push steps above are the immovable ones.
#
# Branch protection on main should require BOTH `CI / verify` and
# `CI / e2e` as required status checks so a merge can't happen without
# a green CI run. This workflow doubles that guarantee for direct
# pushes (which shouldn't happen under branch protection, but belt &
# braces).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only one deploy at a time on main — cancel any in-flight run when a
  # newer commit lands.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI/Verify to succeed
        # `lewagon/wait-on-check-action` polls the checks API for the
        # given commit SHA. If the check fails or is cancelled, this
        # step fails and the rest of the pipeline is skipped.
        # The check names are the job names from ci.yml ("Verify" +
        # "E2E") — GitHub does NOT prefix them with the workflow name
        # in the checks API, only in the PR summary UI.
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: Verify
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      - name: Wait for CI/E2E to succeed
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: E2E
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  db-push:
    name: Apply DB migrations (psql)
    needs: wait-for-ci
    runs-on: ubuntu-latest
    env:
      # Production DATABASE_URL comes from a repository secret. Never
      # commit a real URL.
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install psql
        # scripts/ci/apply-migrations.sh needs psql; postgresql-client is
        # tiny and installs in <5 s. We deliberately avoid depending on
        # pnpm / node / drizzle-kit in this job — the point of this
        # replacement is to NOT touch drizzle-kit's interactive CLI from
        # CI (its arrow-key prompts can't be reliably scripted). See the
        # script's header for the full rationale.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply pending migrations
        # scripts/ci/apply-migrations.sh walks src/lib/db/migrations/*.sql
        # in order, tracks applied filenames in a `__ic_migrations` table,
        # and skips anything already recorded. Idempotent and
        # non-destructive — if any .sql file fails, exits 1 and the
        # rollback job below promotes the previous production deploy
        # back.
        run: ./scripts/ci/apply-migrations.sh

  # Deploy is handled by Vercel's native GitHub integration — every push
  # to main triggers a build+deploy on Vercel's side, using the env vars
  # configured in the Vercel dashboard. That flow was set up when the
  # project was first linked via `vercel link`.
  #
  # This workflow owns the three things Vercel's integration doesn't:
  #   1. wait-for-ci — deploy only proceeds if CI has passed for the SHA
  #   2. db-push — drizzle-kit push against the prod DB before the app
  #      picks up the new schema
  #   3. rollback-on-db-failure — because Vercel's auto-deploy fires in
  #      parallel with this workflow (it watches the branch, not our
  #      jobs), the app ships even when `db-push` fails. In that case we
  #      promote the previous READY production deployment back so the
  #      live app isn't talking to a stale schema. Belt & braces: db-push
  #      is also structured to no-op cleanly if nothing is new.
  #
  # If you ever want CI-driven deploys (e.g. more control over the
  # promote step, or to run more pre-deploy scripts), disable the
  # Vercel-side integration in Project Settings → Git and re-add the
  # `deploy: needs: db-push` job here that runs `vercel deploy --prod`.
  # Stage B Wave 1 release gating — with the Vercel dashboard's
  # production branch pointed at the placeholder branch `production-gate`
  # (Project Settings -> Git), pushes to main only produce PREVIEW
  # builds. Nothing reaches production until this job promotes the
  # preview for this exact SHA - which runs strictly AFTER wait-for-ci
  # (CI green) and db-push (schema applied). This closes the window
  # where Vercel's auto-promotion could serve new code against the old
  # schema before CI finished.
  # Release-readiness item 5 — PROMOTION IS NO LONGER AUTOMATIC.
  # With the Vercel dashboard's production branch pointed at
  # `production-gate`, a push to main only produces a PREVIEW build.
  # This job waits for that preview to be READY and prints its URL for
  # smoke testing. Exposing it to customers requires a human: the owner
  # runs the "Promote to production" workflow (promote-production.yml),
  # which re-verifies CI + migrations for the SHA and only then promotes.
  await-preview-build:
    name: Await preview build (promotion is manual)
    needs: db-push
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Wait for this SHA's preview build and print its URL
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Waiting for a READY preview build of $SHA…"
          dep_url=""
          for i in $(seq 1 60); do
            resp=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20")
            dep_url=$(echo "$resp" | jq -r --arg sha "$SHA"               'first(.deployments[]? | select(.meta.githubCommitSha == $sha and .readyState == "READY") | .url) // ""')
            state=$(echo "$resp" | jq -r --arg sha "$SHA"               'first(.deployments[]? | select(.meta.githubCommitSha == $sha) | .readyState) // ""')
            if [[ -n "$dep_url" ]]; then break; fi
            case "$state" in
              ERROR|CANCELED) echo "✗ Build for $SHA ended $state"; exit 1;;
              *) echo "  [$i/60] build state for $SHA: ${state:-not seen yet}";;
            esac
            sleep 10
          done
          if [[ -z "$dep_url" ]]; then
            echo "✗ No READY build for $SHA within 10 minutes."
            exit 1
          fi
          echo "✓ Preview ready: https://$dep_url"
          echo "### Preview ready — promotion is manual" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke-test: https://$dep_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Then run the **Promote to production** workflow for SHA $SHA." >> "$GITHUB_STEP_SUMMARY"

  rollback-on-db-failure:
    name: Rollback Vercel if db-push failed
    needs: db-push
    if: failure()
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Promote previous READY production deployment
        # Vercel auto-deployed this SHA in parallel to db-push, so the
        # live site is now running new app code against the old schema.
        # Find the most recent READY production deploy whose commit SHA
        # differs from this one, and promote it back to production via
        # the project-promote endpoint.
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "db-push failed — looking for a previous READY deploy to promote back…"
          resp=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=10")
          prev_id=$(echo "$resp" | jq -r --arg sha "$SHA" \
            'first(.deployments[]? | select(.meta.githubCommitSha != $sha) | .uid) // ""')
          if [[ -z "$prev_id" ]]; then
            echo "✗ No previous READY production deployment found — manual rollback required."
            exit 1
          fi
          echo "Promoting deployment $prev_id back to production…"
          curl -sf -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$prev_id?teamId=$VERCEL_ORG_ID" > /dev/null
          echo "✓ Rolled back live production to $prev_id"
          # Fail the overall workflow run so the red X is visible on the
          # commit — the rollback worked but the deploy itself didn't.
          exit 1
