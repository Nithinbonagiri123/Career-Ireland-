name: Deploy

# Production database migrations — MANUAL, OWNER-ONLY, DISABLED BY DEFAULT.
#
# Phase 1 (G1) hardening. This workflow no longer runs on push. A merge
# to main can never touch the production database on its own.
#
# A production migration run requires ALL of the following. The
# owner-account check is defence in depth, never the only gate:
#   1. Kill switch: the repository variable PROD_MIGRATIONS_ENABLED must
#      be exactly 'true'. It is unset today, so every run stops here
#      before reading any credential. Turning it on is a separate,
#      explicitly approved step.
#   2. Started by hand (Actions → Deploy → Run workflow) on main, by the
#      repository owner account, typing MIGRATE.
#   3. CI (Verify + E2E) green for the exact commit being run.
#   4. Protected credentials: PROD_DATABASE_URL must be present. When the
#      GitHub plan supports it, this job's secrets move into the
#      `production` environment with required reviewers; see the
#      limitation note below.
#   5. Verified target: the database host's SHA-256 fingerprint must equal
#      the repository variable PROD_DB_HOST_SHA256 (the URL is never
#      printed), and the server must report itself as a primary.
#   6. Reviewed contents: in `plan` mode the job lists the pending
#      migration files and prints a SHA-256 digest of their exact
#      contents, read-only. `apply` mode refuses unless the typed
#      `reviewed_digest` matches the digest recomputed at apply time, so
#      only the files that were reviewed can run.
#
# LIMITATION (GitHub Free + private repository): repository secrets are
# readable by any workflow run on any branch by anyone with write
# access, and environment required reviewers are unavailable. Until the
# repository plan supports protected environments, the kill switch in
# (1) stays OFF and migrations stay disabled unless separately approved.
#
# The old automatic `rollback-on-db-failure` job is retired. It could
# re-promote an older production build whenever a run failed or was
# declined. Rollback is the manual "Promote to production" workflow with
# the previous good SHA.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read-only list of pending migrations + digest; apply = run them'
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      confirm:
        description: 'Type MIGRATE to confirm'
        required: true
      reviewed_digest:
        description: 'apply only: the digest printed by the plan run you reviewed'
        required: false
        default: ''

permissions:
  contents: read
  checks: read

concurrency:
  group: prod-migrations
  cancel-in-progress: false

jobs:
  gate:
    name: Gate checks (no credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Kill switch, branch, owner, confirmation
        env:
          ENABLED: ${{ vars.PROD_MIGRATIONS_ENABLED }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "${ENABLED:-}" != "true" ]]; then
            echo "✗ Production migrations are disabled (PROD_MIGRATIONS_ENABLED is not 'true'). Enabling them requires separate approval."
            exit 1
          fi
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "✗ Runs only on main (got $REF)."
            exit 1
          fi
          if [[ "$ACTOR" != "$OWNER" || "$TRIGGERING_ACTOR" != "$OWNER" ]]; then
            echo "✗ Only the repository owner account may run production migrations."
            exit 1
          fi
          if [[ "$CONFIRM" != "MIGRATE" ]]; then
            echo "✗ Type MIGRATE exactly to proceed."
            exit 1
          fi
          echo "✓ Gate checks passed."

      - name: CI Verify green for this commit
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: Verify
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      - name: CI E2E green for this commit
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: E2E
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  db-push:
    # Job name kept: promote-production.yml looks for "migrations".
    name: Apply DB migrations (psql)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Verify target database (fingerprint, primary, credentials present)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EXPECTED_HOST_SHA256: ${{ vars.PROD_DB_HOST_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "✗ PROD_DATABASE_URL is not available to this run."
            exit 1
          fi
          if [[ -z "${EXPECTED_HOST_SHA256:-}" ]]; then
            echo "✗ PROD_DB_HOST_SHA256 is not set — refusing to guess the target."
            exit 1
          fi
          host=$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["DATABASE_URL"]).hostname or "")')
          actual=$(printf '%s' "$host" | sha256sum | cut -d' ' -f1)
          if [[ "$actual" != "$EXPECTED_HOST_SHA256" ]]; then
            echo "✗ Database host fingerprint does not match PROD_DB_HOST_SHA256."
            exit 1
          fi
          in_recovery=$(psql "$DATABASE_URL" -tA -c "SELECT pg_is_in_recovery()")
          if [[ "$in_recovery" != "f" ]]; then
            echo "✗ Target is not a writable primary."
            exit 1
          fi
          echo "✓ Target verified by fingerprint (value not printed)."

      - name: Pending migrations and content digest (read-only)
        id: pending
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          applied=$(psql "$DATABASE_URL" -tA -v ON_ERROR_STOP=1 \
            -c "SET default_transaction_read_only = on" \
            -c "SELECT CASE WHEN to_regclass('__ic_migrations') IS NULL THEN '' ELSE (SELECT string_agg(filename, E'\n') FROM __ic_migrations) END")
          : > pending.txt
          shopt -s nullglob
          for f in src/lib/db/migrations/*.sql; do
            name=$(basename "$f")
            if ! grep -qxF "$name" <<<"$applied"; then echo "$name" >> pending.txt; fi
          done
          if [[ -s pending.txt ]]; then
            digest=$(while read -r n; do printf '%s\n' "$n"; sha256sum "src/lib/db/migrations/$n" | cut -d' ' -f1; done < pending.txt | sha256sum | cut -d' ' -f1)
          else
            digest=none
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Pending production migrations"
            if [[ -s pending.txt ]]; then sed 's/^/- /' pending.txt; else echo "None."; fi
            echo ""
            echo "Content digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pending: $(wc -l < pending.txt) file(s). Digest: $digest"

      - name: Apply (only the reviewed set)
        if: inputs.mode == 'apply'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REVIEWED: ${{ inputs.reviewed_digest }}
          DIGEST: ${{ steps.pending.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$DIGEST" == "none" ]]; then
            echo "✓ Nothing to apply."
            exit 0
          fi
          if [[ "$REVIEWED" != "$DIGEST" ]]; then
            echo "✗ reviewed_digest does not match the pending set — run plan again and review it."
            exit 1
          fi
          ./scripts/ci/apply-migrations.sh

  await-preview-build:
    name: Await preview build (promotion is manual)
    needs: db-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this SHA's preview build and print its URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for a READY preview build of $SHA…"
          dep_url=""
          for i in $(seq 1 60); do
            resp=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=20")
            dep_url=$(echo "$resp" | jq -r --arg sha "$SHA" 'first(.deployments[]? | select(.meta.githubCommitSha == $sha and .readyState == "READY") | .url) // ""')
            state=$(echo "$resp" | jq -r --arg sha "$SHA" 'first(.deployments[]? | select(.meta.githubCommitSha == $sha) | .readyState) // ""')
            if [[ -n "$dep_url" ]]; then break; fi
            case "$state" in
              ERROR|CANCELED) echo "✗ Build for $SHA ended $state"; exit 1;;
              *) echo "  [$i/60] build state for $SHA: ${state:-not seen yet}";;
            esac
            sleep 10
          done
          if [[ -z "$dep_url" ]]; then
            echo "✗ No READY build for $SHA within 10 minutes."
            exit 1
          fi
          echo "✓ Preview ready: https://$dep_url"
          echo "### Preview ready — promotion is manual" >> "$GITHUB_STEP_SUMMARY"
          echo "Smoke-test: https://$dep_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Then run the **Promote to production** workflow for SHA $SHA." >> "$GITHUB_STEP_SUMMARY"
